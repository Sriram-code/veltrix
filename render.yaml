# Render Blueprint — Veltrix PeopleOps Assistant
# Deploys: 1 Web Service (Docker) + 1 Free PostgreSQL database
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO DEPLOY:
#   1. Push this repo to GitHub / GitLab.
#   2. Go to https://dashboard.render.com  → New → Blueprint.
#   3. Connect the repo → Render will detect this render.yaml automatically.
#   4. Set the secret env vars in the Render dashboard (see "# SECRET" comments).
#   5. After the first deploy, open the Render Shell for the web service and run:
#        python scripts/schema.sql          # (use psql, see README)
#        python scripts/migrate_sqlite_to_pg.py
#   6. Your app is live at the URL shown in the dashboard.

databases:
  - name: veltrix-db
    databaseName: veltrix
    plan: free          # Render Free Postgres (90-day limit, then must upgrade or re-create)
    region: oregon

services:
  - type: web
    name: veltrix
    runtime: docker     # Uses the repo's Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile

    envVars:
      # --- injected automatically by Render from the database above ---
      - key: DATABASE_URL
        fromDatabase:
          name: veltrix-db
          property: connectionString

      # --- corpus / manifest are baked into the image via the data/ dir ---
      - key: CORPUS_DIR
        value: /app/data/corpus
      - key: MANIFEST_PATH
        value: /app/data/manifest.json
      # DB_PATH is only needed for the migration script; unused at runtime
      - key: DB_PATH
        value: /app/data/veltrix.db

      - key: APP_TODAY
        value: ""

      # --- LLM: pick ONE provider and set its key as a secret ---
      # Option A: Groq (free tier)
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false     # SECRET — set in Render dashboard

      # Option B: OpenAI (comment out Option A, uncomment these)
      # - key: LLM_PROVIDER
      #   value: openai
      # - key: OPENAI_API_KEY
      #   sync: false

      # Option C: Anthropic
      # - key: LLM_PROVIDER
      #   value: anthropic
      # - key: ANTHROPIC_API_KEY
      #   sync: false

      # Option D: Google Gemini
      # - key: LLM_PROVIDER
      #   value: gemini
      # - key: GOOGLE_API_KEY
      #   sync: false

      - key: LLM_MODEL
        value: ""
      - key: LLM_TIMEOUT_S
        value: "12"
      - key: LLM_MAX_ATTEMPTS
        value: "2"

      # --- Retrieval ---
      # EMBEDDINGS=none: no embedding model loaded on the server.
      # Vectors are pre-embedded locally via scripts/embed_to_pg.py
      # and stored in the chunk_embeddings Postgres table.
      - key: EMBEDDINGS
        value: none
      - key: EMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: CORPUS_TOKEN_BUDGET
        value: "2800"
      - key: VECTOR_BACKEND
        value: pgvector
      - key: QDRANT_URL
        value: ""
      - key: QDRANT_COLLECTION
        value: veltrix_chunks
      - key: RERANKER
        value: none
      - key: RERANK_TOP_N
        value: "30"

      # --- Cache ---
      - key: CACHE_ENABLED
        value: "1"
      - key: CACHE_TTL_S
        value: "3600"
      - key: CACHE_MAX_ITEMS
        value: "500"
      - key: CACHE_FUZZY_MIN
        value: "0.88"
      - key: CACHE_SEMANTIC_MIN
        value: "0.92"
      - key: CACHE_PREPLAN_SEMANTIC_MIN
        value: "0.95"

      # --- Logging ---
      - key: LOG_FILE
        value: /tmp/app.log
